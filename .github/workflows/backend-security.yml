name: Backend security foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: health03_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: health03_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HEALTH03_ENV: test
      PGHOST: 127.0.0.1
      PGUSER: health03_test
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: health03_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Python environment
        run: |
          python -m pip install uv==0.12.1
          uv sync --frozen
      - name: Check and test
        run: |
          uv run python backend/manage.py check
          uv run python backend/manage.py makemigrations --check --dry-run
          uv run ruff check --config pyproject.toml backend tests scripts
          python3 scripts/check_security_contracts.py
          uv run pytest -q
