[project]
name = "health-journal"
version = "0.1.0"
description = "Private Pi-hosted health journal backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "django-allauth[headless]>=65.21.1,<66",
  "django-oauth-toolkit==3.4.1",
  "djangorestframework>=3.16,<4",
  "django-cors-headers>=4.7,<5",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=50,<51",
  "gunicorn>=23,<24",
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
  "weasyprint>=70,<71",
  "rfc8785>=0.1.4,<1",
  "jsonschema>=4.26,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
    "openapi-spec-validator>=0.7,<1",
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
